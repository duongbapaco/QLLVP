<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị Lương - Vinapaco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-xl font-bold uppercase tracking-wide">TỔNG CÔNG TY GIẤY VIỆT NAM - VINAPACO</h1>
                <p class="text-xs text-blue-200 mt-1">Hệ Thống Quản Trị Lương, Cước Viễn Thông & Thiết Bị CNTT</p>
            </div>
            <div class="mt-3 md:mt-0 flex gap-2">
                <button onclick="openConfigModal()" class="bg-blue-700 hover:bg-blue-600 px-3 py-2 rounded text-sm font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-link"></i> Cấu hình nâng cao
                </button>
                <button onclick="syncToCloud()" id="syncBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-medium transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Đồng Bộ Mây (5 Tab)
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Controls & Filters -->
        <div class="bg-white p-4 rounded-lg shadow-sm mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase">Tháng lương</label>
                    <select id="salaryMonth" class="mt-1 border border-slate-300 rounded px-3 py-1.5 text-sm bg-slate-50 font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="01">Tháng 01</option><option value="02">Tháng 02</option><option value="03">Tháng 03</option>
                        <option value="04">Tháng 04</option><option value="05">Tháng 05</option><option value="06">Tháng 06</option>
                        <option value="07" selected>Tháng 07</option><option value="08">Tháng 08</option><option value="09">Tháng 09</option>
                        <option value="10">Tháng 10</option><option value="11">Tháng 11</option><option value="12">Tháng 12</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase">Năm</label>
                    <input type="text" id="salaryYear" value="2026" class="mt-1 border border-slate-300 rounded px-3 py-1.5 text-sm w-24 bg-slate-50 font-semibold text-center outline-none">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="addNewStaff()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm font-medium transition flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-user-plus"></i> Thêm Nhân Sự
                </button>
            </div>
        </div>

        <!-- Data Table Container -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-200 text-slate-700 uppercase text-xs font-bold tracking-wider">
                            <th class="p-3 border text-center w-12">TT</th>
                            <th class="p-3 border min-w-[180px]">Họ và tên</th>
                            <th class="p-3 border text-center w-20">Hệ số LCB</th>
                            <th class="p-3 border text-center w-20">Phụ cấp</th>
                            <th class="p-3 border text-center w-20">Hệ số LCV</th>
                            <th class="p-3 border text-center w-20">Phụ cấp LCV</th>
                            <th class="p-3 border text-center w-20">Ngày công</th>
                            <th class="p-3 border text-right w-28">Ăn ca (×5.000đ)</th>
                            <th class="p-3 border text-right w-28">Độc hại (VNĐ)</th>
                            <th class="p-3 border text-right w-32">Thực lĩnh NET</th>
                            <th class="p-3 border text-center w-16">Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody" class="divide-y divide-slate-200">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Config Modal -->
    <div id="configModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-lg w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">Cấu hình Hệ thống & API Mây</h3>
                <button onclick="closeConfigModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Link Google Script Web App API (`.../exec`):</label>
                    <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border rounded p-2 text-xs bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Mức lương cơ sở:</label>
                        <input type="number" id="baseVal" value="2650000" class="w-full border rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Mức lương tối thiểu vùng:</label>
                        <input type="number" id="vungVal" value="4140000" class="w-full border rounded p-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Mức quy đổi LCV:</label>
                    <input type="number" id="lcvVal" value="1991139" class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Người lập biểu (ký tên):</label>
                    <input type="text" id="signerName" value="Nguyễn Thị Tuyết Nhung" class="w-full border rounded p-2 text-sm">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="closeConfigModal()" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded font-medium">Hủy</button>
                <button onclick="saveConfig()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-medium">Lưu Cấu Hình</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded shadow-lg hidden z-50 text-sm flex items-center gap-2">
        <span id="toastMsg">Thành công!</span>
    </div>

    <script>
        let staffList = [
            { name: "Nguyễn Minh Ngọc", lcb_heso: 1.94, lcb_phucap: 0.25, he_so_lcv: 1.0, phu_cap_lcv: 0, NT: 20, dohai: 0, account: "1012345678" },
            { name: "Nguyễn Văn Nam", lcb_heso: 1.48, lcb_phucap: 0.0, he_so_lcv: 1.0, phu_cap_lcv: 0, NT: 14, dohai: 0, account: "1012345679" },
            { name: "Nguyễn Thị Tuyết Nhung", lcb_heso: 1.79, lcb_phucap: 0.0, he_so_lcv: 1.0, phu_cap_lcv: 0, NT: 20, dohai: 0, account: "1012345680" },
            { name: "Vũ Thị Thu", lcb_heso: 1.94, lcb_phucap: 0.0, he_so_lcv: 1.0, phu_cap_lcv: 0, NT: 21, dohai: 0, account: "1012345681" }
        ];

        function renderTable() {
            const tbody = document.getElementById('staffTableBody');
            tbody.innerHTML = '';
            
            const lcvVal = parseFloat(document.getElementById('lcvVal').value) || 1991139;

            staffList.forEach((s, idx) => {
                // Tiền ăn ca tự động tính bằng Công thực tế (NT) * 5.000 VNĐ
                let ancaVal = s.NT * 5000;
                s.anca = ancaVal; 

                // Tính lương công việc thực tế
                let hsHtcv = parseFloat(s.hs_htcv) || 1.0;
                let luongCV = (s.he_so_lcv + s.phu_cap_lcv) * lcvVal * hsHtcv;
                let lcvThucTe = (luongCV / 22) * s.NT;
                let thucLinhCV = lcvThucTe; 

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-3 border text-center font-semibold text-slate-500">${idx + 1}</td>
                    <td class="p-3 border"><input type="text" value="${s.name}" onchange="updateStaff(${idx}, 'name', this.value)" class="w-full bg-transparent outline-none font-medium"></td>
                    <td class="p-3 border text-center"><input type="number" step="0.01" value="${s.lcb_heso}" onchange="updateStaff(${idx}, 'lcb_heso', this.value)" class="w-16 text-center border rounded p-1"></td>
                    <td class="p-3 border text-center"><input type="number" step="0.01" value="${s.lcb_phucap}" onchange="updateStaff(${idx}, 'lcb_phucap', this.value)" class="w-16 text-center border rounded p-1"></td>
                    <td class="p-3 border text-center"><input type="number" step="0.01" value="${s.he_so_lcv}" onchange="updateStaff(${idx}, 'he_so_lcv', this.value)" class="w-16 text-center border rounded p-1"></td>
                    <td class="p-3 border text-center"><input type="number" step="0.01" value="${s.phu_cap_lcv}" onchange="updateStaff(${idx}, 'phu_cap_lcv', this.value)" class="w-16 text-center border rounded p-1"></td>
                    <td class="p-3 border text-center"><input type="number" value="${s.NT}" onchange="updateStaff(${idx}, 'NT', this.value)" class="w-16 text-center border rounded p-1"></td>
                    <td class="p-3 border text-right font-semibold text-emerald-700">${ancaVal.toLocaleString('vi-VN')} đ</td>
                    <td class="p-3 border text-right"><input type="number" value="${s.dohai || 0}" onchange="updateStaff(${idx}, 'dohai', this.value)" class="w-24 text-right border rounded p-1"></td>
                    <td class="p-3 border text-right font-bold text-blue-700">${Math.round(thucLinhCV).toLocaleString('vi-VN')} đ</td>
                    <td class="p-3 border text-center"><button onclick="removeStaff(${idx})" class="text-red-500 hover:text-red-700 px-2 py-1"><i class="fa-solid fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStaff(index, field, value) {
            if (field === 'name') {
                staffList[index][field] = value;
            } else {
                staffList[index][field] = parseFloat(value) || 0;
            }
            if (field === 'NT') {
                renderTable(); 
            }
        }

        function addNewStaff() {
            staffList.push({ name: "Nhân sự mới", lcb_heso: 1.5, lcb_phucap: 0, he_so_lcv: 1.0, phu_cap_lcv: 0, NT: 20, dohai: 0, account: "100000000" });
            renderTable();
        }

        function removeStaff(index) {
            staffList.splice(index, 1);
            renderTable();
        }

        function openConfigModal() {
            document.getElementById('apiUrlInput').value = localStorage.getItem('vinapaco_api_url') || '';
            document.getElementById('configModal').classList.remove('hidden');
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.add('hidden');
        }

        function saveConfig() {
            const url = document.getElementById('apiUrlInput').value.trim();
            localStorage.setItem('vinapaco_api_url', url);
            showToast("Đã lưu cấu hình thành công!");
            closeConfigModal();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3500);
        }

        function syncToCloud() {
            const apiUrl = localStorage.getItem('vinapaco_api_url');
            if (!apiUrl) {
                alert("Vui lòng bấm vào 'Cấu hình nâng cao' để nhập Link Google Script Web App API trước khi đồng bộ!");
                openConfigModal();
                return;
            }

            const syncBtn = document.getElementById('syncBtn');
            syncBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang đồng bộ...`;
            syncBtn.disabled = true;

            const payload = {
                action: "sync_salary_data_pro",
                year: document.getElementById('salaryYear').value,
                month: document.getElementById('salaryMonth').value,
                config: {
                    base: document.getElementById('baseVal').value,
                    vung: document.getElementById('vungVal').value,
                    lcv: document.getElementById('lcvVal').value,
                    signer: document.getElementById('signerName').value
                },
                staffs: staffList
            };

            fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                syncBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Đồng Bộ Mây (5 Tab)`;
                syncBtn.disabled = false;
                if (data.status === "success") {
                    showToast("Đồng bộ mây thành công! File Excel đã lưu vào Drive.");
                    if(data.fileUrl) {
                        window.open(data.fileUrl, '_blank');
                    }
                } else {
                    alert("Lỗi từ server: " + data.message);
                }
            })
            .catch(err => {
                syncBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Đồng Bộ Mây (5 Tab)`;
                syncBtn.disabled = false;
                alert("Lỗi kết nối: " + err);
            });
        }

        window.onload = renderTable;
    </script>
</body>
</html>
